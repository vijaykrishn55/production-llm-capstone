services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      VLLM_BASE_URL: http://vllm:8000/v1
      SQLITE_PATH: /app/data/capstone.db
      CORPUS_PATH: /app/data/corpus.json
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    profiles: ["gpu"]
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    ports:
      - "8001:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./models:/models:ro
    ipc: host
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct}"
      - "--served-model-name"
      - "${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "4096"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--max-num-seqs"
      - "16"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  qdrant_storage:
  hf_cache:
